<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>潼视 PoTV | 福音传递爱</title>
<meta name="description" content="潼视 PoTV——福音视频社区，讲道视频、赞美诗歌、福音见证在线观看">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Noto Sans SC','Microsoft YaHei',sans-serif;background:#0f1115;color:#e8e6e1;min-height:100vh}
a{text-decoration:none;color:inherit}
.top{background:linear-gradient(135deg,#101418,#1d2b3a);padding:32px 20px;text-align:center;border-bottom:1px solid #232a35}
.top h1{font-size:26px;letter-spacing:2px;color:#5aa2e8;margin-bottom:8px}
.top p{font-size:14px;opacity:.7}
.top a.home{display:inline-block;margin-top:14px;padding:8px 22px;border:1px solid #5aa2e8;border-radius:20px;color:#5aa2e8;font-size:13px}
.top a.home:hover{background:#5aa2e8;color:#0f1115}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 60px}
.cat{font-size:15px;color:#5aa2e8;font-weight:700;margin:28px 0 12px;padding-left:10px;border-left:4px solid #5aa2e8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:#171c26;border-radius:10px;overflow:hidden;border:1px solid #232a35;transition:transform .2s;cursor:pointer}
.card:hover{transform:translateY(-3px);border-color:#5aa2e8}
.card .thumb{width:100%;height:130px;object-fit:cover;background:#0f1115;display:flex;align-items:center;justify-content:center;font-size:40px}
.card .info{padding:12px}
.card .info h3{font-size:14px;margin-bottom:4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .info span{font-size:12px;color:#8a95a5}
.player-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99;padding:20px}
.player-modal.show{display:flex;flex-direction:column}
.player-modal .pm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.player-modal .pm-top h2{font-size:16px;color:#fff;flex:1;padding-right:12px}
.player-modal .pm-close{font-size:28px;cursor:pointer;color:#8a95a5;padding:0 8px}
.player-modal iframe{flex:1;width:100%;border:0;border-radius:8px;background:#000}
.footer{text-align:center;padding:20px;color:#5c6570;font-size:12px;border-top:1px solid #232a35}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="top">
  <h1>🎬 潼视 PoTV</h1>
  <p>福音视频社区 · 讲道 · 诗歌 · 见证 · 直播</p>
  <a class="home" href="/">← 返回福音传递爱首页</a>
</div>
<div class="wrap">
  <div class="cat">🔥 热播推荐</div>
  <div class="grid" id="hotGrid"></div>
  <div class="cat">📺 讲道信息</div>
  <div class="grid" id="sermonGrid"></div>
  <div class="cat">🎵 赞美诗歌</div>
  <div class="grid" id="songGrid"></div>
</div>
<div class="player-modal" id="playerModal">
  <div class="pm-top"><h2 id="pmTitle"></h2><span class="pm-close" onclick="closePlayer()">✕</span></div>
  <iframe id="pmFrame" allowfullscreen allow="autoplay; encrypted-media"></iframe>
</div>
<div class="footer">© 福音传递爱 szxfuyin.com · 潼视 PoTV</div>
<script>
var VIDEOS = {
  hot: [
    {title:'观念的后果 - 史普罗',movid:3952},
    {title:'福音慕道 #1',movid:2942},
    {title:'新约神学 - 孙宝玲',movid:3951},
    {title:'信心是什么 - 冯秉诚',movid:3063},
    {title:'唐崇荣 - 归正福音解经',movid:3950},
    {title:'罗马书 - 陆大龄',movid:3949}
  ],
  sermon: [
    {title:'摩西五经 - 赖建国',movid:3948},
    {title:'诗篇 - 吴献章',movid:3947},
    {title:'箴言 - 刘幸枝',movid:3946},
    {title:'路加福音 - 孙宝玲',movid:3945},
    {title:'约翰福音 - 黄子嘉',movid:3944},
    {title:'使徒行传 - 张圣佳',movid:3943}
  ],
  song: [
    {title:'赞美之泉 - 精选MTV',movid:3942},
    {title:'迦南诗歌专辑',movid:3941},
    {title:'天韵诗歌MTV',movid:3940},
    {title:'奚秀兰圣诗',movid:3939},
    {title:'新篇赞美诗选集',movid:3938},
    {title:'选本诗歌大全',movid:3937}
  ]
};
function play(movid,title){
  document.getElementById('pmTitle').textContent = title;
  document.getElementById('pmFrame').src = 'https://www.fuyin.tv/content/view/movid/' + movid + '/index.html';
  document.getElementById('playerModal').classList.add('show');
}
function closePlayer(){
  document.getElementById('playerModal').classList.remove('show');
  document.getElementById('pmFrame').src = '';
}
function cardHtml(it){
  return '<div class="card" onclick="play(' + it.movid + ',\'' + it.title + '\')">' +
    '<div class="thumb">▶️</div>' +
    '<div class="info"><h3>' + it.title + '</h3><span>点击播放 · 福音TV源</span></div></div>';
}
document.getElementById('hotGrid').innerHTML = VIDEOS.hot.map(cardHtml).join('');
document.getElementById('sermonGrid').innerHTML = VIDEOS.sermon.map(cardHtml).join('');
document.getElementById('songGrid').innerHTML = VIDEOS.song.map(cardHtml).join('');
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePlayer()});
</script>
</body>
</html>
