# ============================================================
# 🚀 福音传播爱 - Nginx反向代理配置
# 用法：
# 1. 将此文件上传到服务器 /etc/nginx/sites-available/szxfuyin
# 2. 创建软链接：ln -s /etc/nginx/sites-available/szxfuyin /etc/nginx/sites-enabled/
# 3. 测试配置：nginx -t
# 4. 重载nginx：systemctl reload nginx
# 
# 或者直接复制下面 server{} 块到你的 nginx 配置中
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name szxfuyin.com www.szxfuyin.com;

    # HTTP → HTTPS 强制跳转（需要SSL证书）
    # return 301 https://$server_name$request_uri;
    
    # 如果没有SSL证书，直接使用HTTP也可以工作
    # 但建议使用 certbot 申请免费SSL证书
    # sudo apt install certbot python3-certbot-nginx
    # sudo certbot --nginx -d szxfuyin.com -d www.szxfuyin.com

    # ========== 静态文件 ==========
    # 如果通过 nginx 直接提供静态文件（性能最优）
    root /var/www/szxfuyin;
    index index.html;

    location / {
        try_files $uri $uri/ @serverjs;
    }

    # ========== 🔥🔥🔥 红客终极反代：vod-hls-pc.sanmanuela.com 视频流 ==========
    # 原理：服务器端发请求带 fuyin.tv 的 Referer → CDN防盗链放行 → MP4直链全球可播！
    # 前端请求格式：/proxy/vod/.../毒祸.mp4?auth_key=xxx
    location /proxy/vod/ {
        proxy_pass https://vod-hls-pc.sanmanuela.com/;
        proxy_http_version 1.1;
        proxy_set_header Host vod-hls-pc.sanmanuela.com;
        proxy_set_header Referer 'https://www.fuyin.tv/';
        proxy_set_header Origin 'https://www.fuyin.tv';
        proxy_set_header User-Agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        
        # 防盗链头全配齐
        proxy_set_header Accept 'video/mp4,video/*,*/*';
        proxy_set_header Accept-Language 'zh-CN,zh;q=0.9';
        proxy_set_header Sec-Fetch-Site 'same-site';
        proxy_set_header Sec-Fetch-Mode 'navigate';
        proxy_set_header Sec-Fetch-Dest 'video';
    }

    # ========== 🔥 核心：API反向代理到 server.js（3000端口） ==========
    # 所有 /api/ 开头的请求转发到 server.js
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置（视频流可能较长）
        proxy_connect_timeout 60;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ========== 兜底：转发到 server.js ==========
    location @serverjs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ========== HTTPS 版本（SSL证书配置后生效） ==========
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name szxfuyin.com www.szxfuyin.com;

    # SSL证书路径（用 certbot 自动生成）
    ssl_certificate /etc/letsencrypt/live/szxfuyin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szxfuyin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/szxfuyin;
    index index.html;

    location / {
        try_files $uri $uri/ @serverjs;
    }

    # 🔥 API反向代理（核心！）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location @serverjs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
