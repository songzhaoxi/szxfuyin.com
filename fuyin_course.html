 <script src="fuyin_chuandiai_data.js?v=9"></script>
<script>
$(function() {
  var id = parseInt(new URLSearchParams(window.location.search).get('id')) || 1;

  var course = null;
  for (var ci = 0; ci < COURSE_DATA.length; ci++) {
    for (var bi = 0; bi < COURSE_DATA[ci].books.length; bi++) {
      if (COURSE_DATA[ci].books[bi].id === id) {
        course = COURSE_DATA[ci].books[bi];
        break;
      }
    }
    if (course) break;
  }
  if (!course) { course = COURSE_DATA[0].books[0]; id = course.id; }

  document.title = course.title + ' - ' + course.teacher + ' - 福音传递爱圣经学院研读课程';
  $('#ctitle').html(course.title + ' <small>课程目录</small>');
  $('#cteacher').text('授教师: ' + course.teacher);

  // 导航菜单
  var tmenu = '', cmenu = '';
  for (var i = 0; i < COURSE_DATA.length; i++) {
    cmenu += '<li><a href="fuyin_chuandiai.html#cat' + (i+1) + '">' + COURSE_DATA[i].cat + '</a></li>';
    if (i < COURSE_DATA.length - 1) cmenu += '<li role="separator" class="divider"></li>';
    for (var j = 0; j < COURSE_DATA[i].books.length; j++) {
      var b = COURSE_DATA[i].books[j];
      tmenu += '<li><a href="fuyin_course.html?id=' + b.id + '">' + b.teacher + '</a></li>';
      tmenu += '<li role="separator" class="divider"></li>';
    }
  }
  $('#teacher-menu').html(tmenu);
  $('#cat-menu').html(cmenu);

  // 生成单元列表
  var units = parseInt(course.units) || 20;
  var dRows = '', mRows = '';
  for (var u = 1; u <= units; u++) {
    var seq = (u < 10 ? '0' : '') + u;
    var uid = 'u' + id + '_' + u;
    var mp3 = 'https://xue2.52fuyin.com/file/mp3/' + id + '/' + seq + '.mp3';
    var doc = 'https://xue2.52fuyin.com/file/doc/' + id + '/' + seq + '.pdf';

    dRows += '<tr><td>' + seq + '</td>';
    dRows += '<td><a href="javascript:void(0)" onclick="playMedia(\'' + uid + '\',\'' + mp3 + '\',' + id + ',' + u + ')">第' + u + '课</a></td>';
    dRows += '<td><a target="_blank" class="turl" href="' + mp3 + '">MP3 <i class="glyphicon glyphicon-download-alt"></i></a> ';
    dRows += '<a target="_blank" class="turl" href="' + doc + '">讲义 <i class="glyphicon glyphicon-download-alt"></i></a></td></tr>';

    mRows += '<div class="mobile-table-row">';
    mRows += '<span>' + seq + '</span><label></label>';
    mRows += '<span class="mtr-max"><a href="javascript:void(0)" onclick="playMedia(\'' + uid + '\',\'' + mp3 + '\',' + id + ',' + u + ')">第' + u + '课</a></span>';
    mRows += '<span onclick="$(\'#mm-' + uid + '\').toggle()">详情</span></div>';
    mRows += '<div class="mobile-table-row-more" id="mm-' + uid + '" style="display:none">';
    mRows += '<div></div><div><span>资源下载：</span>';
    mRows += '<a target="_blank" class="turl" href="' + mp3 + '">MP3 <i class="glyphicon glyphicon-download-alt"></i></a> ';
    mRows += '<a target="_blank" class="turl" href="' + doc + '">讲义 <i class="glyphicon glyphicon-download-alt"></i></a>';
    mRows += '</div></div>';
  }
  $('#desktop-tbody').html(dRows);
  $('#mobile-table').append(mRows);
});

var curMedia = null;
var curPlayerDiv = null;
function playMedia(uid, mp3Url, bookId, unitNum) {
  if (curMedia) { curMedia.audio.pause(); }
  if (curPlayerDiv) { curPlayerDiv.remove(); curPlayerDiv = null; }
  var seq = (unitNum < 10 ? '0' : '') + unitNum;
  var playerUrl = 'https://xue2.52fuyin.com/file/doc/' + bookId + '/' + seq + '/html5.html';
  var playerHtml = '<div id="vp-' + uid + '" style="margin-top:15px;border:2px solid #337ab7;border-radius:6px;overflow:hidden;background:#8a8a8a">';
  // 播放区标题
  playerHtml += '<div style="padding:10px 15px;background:#337ab7;color:#fff;font-size:16px">';
  playerHtml += '📖 第' + unitNum + '课 · 点击下方画面播放 ▶ 画面与语音同步一致';
  playerHtml += '</div>';
  // iSpring播放器iframe——画面与语音同步的主播放器（唯一音源，杜绝双音冲突）
  playerHtml += '<div class="video-player"><iframe src="' + playerUrl + '" allowfullscreen></iframe></div>';
  // MP3音频备选（不自动播放，避免与画面声音冲突）
  playerHtml += '<div style="padding:15px;background:#f9f9f9;border-top:1px solid #ddd">';
  playerHtml += '<strong>🎵 MP3音频（内嵌播放）</strong> <small style="color:#999">如画面无声音，点此播放MP3（二选一，避免冲突）</small><br>';
  playerHtml += '<audio controls preload="none" style="width:100%;max-width:500px;margin-top:8px"><source src="' + mp3Url + '" type="audio/mpeg"></audio>';
  playerHtml += '</div>';
  playerHtml += '</div>';
  $(playerHtml).insertAfter('#jumbo');
  curMedia = {audio: document.querySelector('#vp-' + uid + ' audio'), uid: uid};
  curPlayerDiv = document.getElementById('vp-' + uid);
  // 滚动到播放器
  curPlayerDiv.scrollIntoView({behavior:'smooth'});
}
</script>
