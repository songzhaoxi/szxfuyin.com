<meta name="description" content="兆西福音博客——分享圣经真理、信仰见证、灵修心得与福音信息">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Noto Sans SC','Microsoft YaHei',sans-serif;background:#f7f3ec;color:#2c1a08;min-height:100vh}
a{text-decoration:none;color:inherit}
.top{background:linear-gradient(135deg,#3d1f05,#7a4a1e);color:#fdf3e0;padding:32px 20px;text-align:center}
.top h1{font-size:26px;letter-spacing:2px;margin-bottom:8px}
.top p{font-size:14px;opacity:.85}
.top a.home{display:inline-block;margin-top:14px;padding:8px 22px;border:1px solid #e8b96a;border-radius:20px;color:#e8b96a;font-size:13px}
.top a.home:hover{background:#e8b96a;color:#3d1f05}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 60px}
.cat{font-size:15px;color:#7a4a1e;font-weight:700;margin:28px 0 12px;padding-left:10px;border-left:4px solid #c8973a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(90,50,10,.08);transition:transform .2s;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(90,50,10,.15)}
.card img{width:100%;height:120px;object-fit:cover;background:#eee}
.card .info{padding:12px}
.card .info h3{font-size:15px;margin-bottom:4px;color:#3d1f05}
.card .info span{font-size:12px;color:#8a7a6a}
.footer{text-align:center;padding:20px;color:#a89880;font-size:12px;border-top:1px solid #e6ddcd}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
